name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  # When a version tag is pushed, ask the Go proxy to fetch it so that
  # pkg.go.dev publishes the new version without waiting for a first user.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Warm the Go proxy
        run: |
          GOPROXY=https://proxy.golang.org GO111MODULE=on \
            go list -m "github.com/${{ github.repository }}@${{ github.ref_name }}"
